<!doctype html>
<html lang="en" class="{{theme}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="referrer" content="no-referrer">
<title>{{title}}</title>
<link rel="icon" id="icon" href="{{icon}}">
<link rel="stylesheet" href="/assets/style.css">
<script type="module" src="/assets/app.js"></script>
</head>
<body>
<header class="top">
  <button type="button" id="nav-toggle" class="btn ghost" aria-controls="nav" aria-expanded="false" aria-label="Toggle navigation">&#9776;</button>
  <a class="brand" href="/overview">
    <span class="brand-logo" id="logo-tile"><img id="logo" src="{{icon}}" alt=""></span>
    <span class="brand-text"><span id="title">{{title}}</span><small id="subtitle">{{subtitle}}</small></span>
  </a>
  <span id="instance" class="muted instance"></span>
  <span class="grow"></span>
  <span id="live" class="badge muted" role="status">connecting</span>
  <button type="button" id="theme-btn" class="btn ghost icon-only" aria-label="Switch colour theme" title="Switch colour theme"></button>
  <button type="button" id="token-btn" class="btn ghost small label-btn">Set token</button>
  <button type="button" id="forget-btn" class="btn ghost small label-btn" hidden>Forget token</button>
</header>
<div class="shell">
  <nav id="nav" aria-label="Main navigation">
    <a class="nav-brand" id="nav-brand" href="/overview" aria-label="{{title}}" {{nav_logo}}><img id="nav-logo" src="{{icon}}" alt=""></a>
    <a href="/overview"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3h7v9H3zM14 3h7v5h-7zM14 12h7v9h-7zM3 16h7v5H3z"/></svg><span>Overview</span></a>
    <a href="/send"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7Z"/></svg><span>Send SMS</span></a>
    <a href="/contacts"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg><span>Contacts</span></a>
    <span class="nav-gap" aria-hidden="true"></span>
    <a href="/inbox"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 12h-6l-2 3h-4l-2-3H2M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11Z"/></svg><span>Inbox</span></a>
    <a href="/outbox"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg><span>Outbox</span></a>
    <a href="/history"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5M12 7v5l4 2"/></svg><span>Message History</span></a>
    <a href="/queue"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg><span>Message Queue</span></a>
    <a href="/threats"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/><path d="M12 8v4M12 16h.01"/></svg><span>Threats</span></a>
    <span class="nav-gap" aria-hidden="true"></span>
    <a href="/pdu"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m16 18 6-6-6-6M8 6l-6 6 6 6"/></svg><span>PDU Tools</span></a>
    <a href="/calls"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92Z"/></svg><span>Calls</span></a>
    <a href="/integrations"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6ZM6 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6ZM18 22a3 3 0 1 0 0-6 3 3 0 0 0 0 6ZM8.59 13.51l6.83 3.98M15.41 6.51l-6.82 3.98"/></svg><span>Integrations</span></a>
    <a href="/modem"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 20h.01M7 20v-4M12 20v-8M17 20V8M22 4v16"/></svg><span>Modem</span></a>
    <a href="/tokens"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 14a3 3 0 1 0 0-6 3 3 0 0 0 0 6ZM10 11h10M18 11v3M14 11v2"/></svg><span>API Tokens</span></a>
    <a href="/system"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6ZM19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg><span>System</span></a>
    <a href="/docs"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg><span>API Documentation</span></a>
  </nav>
  <main id="main">
    <h1>{{title}}</h1>
    <p class="muted">Loading the dashboard…</p>
    <noscript><p>This dashboard needs JavaScript. The REST API is available under <code>/api/v1/</code>.</p></noscript>
  </main>
</div>
<footer class="foot" id="foot">
  <span>{{title}}</span>
</footer>
<div id="toasts" aria-live="polite"></div>
</body>
</html>
